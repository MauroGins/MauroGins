<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#12305a" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .p { fill: #6f8bb0; font-size: 15px; }
    .c { fill: #c9d6e8; font-size: 20px; }
    .s { fill: #5aa9ff; }
    .n { fill: #5aa9ff; font-size: 54px; font-weight: 700; letter-spacing: 8px; }
    .cur { fill: #5aa9ff; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
  </style>

  <rect width="1000" height="280" rx="10" fill="#0a1a2f"/>
  <rect width="1000" height="280" rx="10" fill="url(#grid)" opacity="0.5"/>
  <rect x="2" y="2" width="996" height="276" rx="9" fill="none" stroke="#2f7fd1" stroke-width="2" filter="url(#glow)"/>
  <line x1="2" y1="42" x2="998" y2="42" stroke="#2f7fd1" stroke-opacity="0.6"/>
  <text x="24" y="27" class="p">mauro@galicia: ~</text>
  <text x="976" y="27" class="p" text-anchor="end">Galicia, España</text>

  <text x="40" y="84" class="c"><tspan class="s">$</tspan> whoami</text>
  <text x="40" y="146" class="n" filter="url(#glow)">MAURO BAIONA</text>

  <text x="40" y="190" class="c"><tspan class="s">$</tspan> cat estado.txt</text>
  <text x="40" y="218" class="c" style="fill:#9fc4ee">Estudiante de desarrollo de aplicaciones móviles</text>

  <text x="40" y="254" class="c"><tspan class="s">$</tspan></text>
  <rect class="cur" x="64" y="238" width="12" height="20"/>
</svg>
